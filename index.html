<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2733">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>วิ่งหนีน้ำท่วม</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" role="img"></canvas>
    <div id="hud-buttons">
      <button id="btn-pause" class="icon-btn" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
      </button>
      <button id="btn-mute" class="icon-btn" type="button">
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div id="rotate-hint"><span class="phone" aria-hidden="true"></span><span data-t="rotate"></span></div>

  <section id="screen-loading" class="overlay show">
    <p class="loading-text" data-t="loading"></p>
  </section>

  <section id="screen-menu" class="overlay">
    <div class="menu-inner">
      <h1 class="game-title" data-t="menu.title"></h1>
      <p class="tagline" data-t="menu.tagline"></p>
      <p class="choose" data-t="menu.choose"></p>
      <div class="cards" id="cards" role="radiogroup"></div>
      <button id="btn-start" class="btn btn-primary" type="button" data-t="menu.start"></button>
      <p class="best-line"><span data-t="menu.best"></span> <strong id="menu-best">0</strong> <span data-t="hud.unit"></span></p>
      <p class="howto" id="howto"></p>
      <p class="howto" id="howto-select"></p>
    </div>
  </section>

  <section id="screen-pause" class="overlay">
    <div class="panel">
      <h2 class="panel-title" data-t="pause.title"></h2>
      <p class="panel-sub" data-t="pause.sub"></p>
      <div class="panel-actions">
        <button id="btn-resume" class="btn btn-primary" type="button" data-t="pause.resume"></button>
        <button id="btn-pause-menu" class="btn btn-ghost" type="button" data-t="pause.menu"></button>
      </div>
      <p class="hint" data-t="pause.hint"></p>
    </div>
  </section>

  <section id="screen-over" class="overlay">
    <div class="panel">
      <p class="over-kicker" data-t="over.heading"></p>
      <h2 class="over-msg" id="over-msg"></h2>
      <p class="over-late" id="over-late"></p>
      <div class="stats">
        <div class="stat"><span data-t="over.distance"></span><strong id="over-distance"></strong></div>
        <div class="stat"><span data-t="over.best"></span><strong id="over-best"></strong></div>
      </div>
      <p class="record" id="over-record" data-t="over.newRecord" hidden></p>
      <div class="panel-actions">
        <button id="btn-retry" class="btn btn-primary" type="button" data-t="over.retry"></button>
        <button id="btn-over-menu" class="btn btn-ghost" type="button" data-t="over.menu"></button>
      </div>
      <p class="hint" id="over-hint"></p>
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/background.js"></script>
  <script src="js/player.js"></script>
  <script src="js/obstacles.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
